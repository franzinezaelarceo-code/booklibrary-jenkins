services:
  web:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: library
      DB_USER: libraryuser
      DB_PASSWORD: librarypass
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: libraryuser
      POSTGRES_PASSWORD: librarypass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libraryuser -d library"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    build: ./nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "8083:80"

volumes:
  postgres_data:
